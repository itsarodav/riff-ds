<pg-navbar />

<main id="main" tabindex="-1">
  <!-- ---- Hero ---- -->
  <section class="container hero">
    <h1 class="hero__title">Diseña una vez.<br />Úsalo en cada producto.</h1>
    <p class="hero__lede">
      Tokens, foundations y componentes que no dependen de ningún framework.<br />
      Los mismos nombres en Figma, en CSS y en Angular o React.
    </p>
    <div class="hero__actions">
      <a class="button button--secondary" routerLink="/introduccion">Leer la documentación</a>
      <a class="button button--primary" routerLink="/foundations/color">Abrir el playground</a>
    </div>
  </section>

  <!-- ---- Vista previa: maqueta hecha con los tokens reales ---- -->
  <figure class="showcase">
    <figcaption class="pg-sr-only">
      Vista previa del playground: rampas de color, mensajes de feedback y botones del design
      system.
    </figcaption>
    <div class="window" aria-hidden="true">
      <div class="window__bar">
        <span class="window__dots"><i></i><i></i><i></i></span>
        <span class="window__title">Riff DS · Playground</span>
      </div>
      <div class="window__body">
        <aside class="mock-nav">
          <pg-logo class="mock-nav__logo" />
          <span class="mock-nav__group">Docs</span>
          <span class="mock-nav__item">Introducción</span>
          <span class="mock-nav__item">Cómo instalar</span>
          <span class="mock-nav__item">Changelog</span>
          <span class="mock-nav__group">Foundations</span>
          <span class="mock-nav__item is-active">Color</span>
          <span class="mock-nav__item">Color semántico</span>
          <span class="mock-nav__group">Componentes</span>
          <span class="mock-nav__item is-soon">Próximamente</span>
        </aside>

        <div class="mock-main">
          <div class="mock-main__head">
            <span class="mock-main__eyebrow">Foundations</span>
            <span class="mock-main__title">Color</span>
          </div>
          <div class="mock-ramps">
            @for (ramp of ramps; track ramp) {
              <div class="mock-ramp">
                <span class="mock-ramp__name">{{ ramp }}</span>
                <span class="mock-ramp__steps">
                  @for (step of steps; track step) {
                    <span [style.background]="'var(--riff-' + ramp + '-' + step + ')'"></span>
                  }
                </span>
              </div>
            }
          </div>
        </div>

        <div class="mock-side">
          @for (message of messages; track message.kind) {
            <div
              class="mock-message"
              [style.background]="fb(message.kind, 'background')"
              [style.color]="fb(message.kind, 'content')"
            >
              <span class="mock-message__icon" [style.background]="fb(message.kind, 'icon')"></span>
              {{ message.text }}
            </div>
          }
          <div class="mock-actions">
            <span class="mock-button mock-button--secondary">Vista previa</span>
            <span class="mock-button mock-button--primary">Publicar</span>
          </div>
          <div class="mock-contrast">
            <span class="mock-contrast__chip">Aa</span>
            <span class="mock-contrast__badge">✓ AA 5.19:1</span>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <!-- ---- Tarjetas ---- -->
  <section class="container cards" aria-labelledby="cards-title">
    <h2 id="cards-title" class="cards__title">Explora el sistema</h2>
    <ul class="cards__grid">
      @for (card of cards; track card.title) {
        <li>
          <pg-card [title]="card.title" [description]="card.description" [href]="card.path" [soon]="!card.path">
            <pg-card-art cardArt [kind]="card.art" />
          </pg-card>
        </li>
      }
    </ul>
  </section>
</main>

<pg-footer />
