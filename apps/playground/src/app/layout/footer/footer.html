<footer class="footer">
  <div class="footer__main">
    <div class="footer__inner">
      <a class="footer__brand" routerLink="/" aria-label="Riff DS, ir a la portada">
        <pg-logo class="footer__logo" mono />
      </a>
      <nav class="footer__links" aria-label="Pie de página">
        @for (link of nav; track link.path) {
          <a [routerLink]="link.path">{{ link.label }}</a>
        }
        <a [href]="repoUrl" target="_blank" rel="noopener noreferrer">
          GitHub<span class="pg-sr-only"> (se abre en una pestaña nueva)</span>
        </a>
      </nav>
      @if (themeSwitch()) {
        <pg-segmented legend="Tema" legendHidden [options]="themeOptions" [(value)]="theme.mode" />
      }
    </div>
  </div>

  <div class="footer__credits">
