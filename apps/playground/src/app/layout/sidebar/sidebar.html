<a class="brand" routerLink="/" aria-label="Riff DS, ir a la portada">
  <pg-logo class="brand__logo" />
</a>

<nav class="nav" aria-label="Secciones del playground">
  @for (section of sections; track section.id) {
    <section class="nav__group" [attr.aria-labelledby]="'nav-' + section.id">
      <h2 class="nav__title" [id]="'nav-' + section.id">{{ section.label }}</h2>
      @if (section.pages.length) {
        <ul class="nav__list">
          @for (page of section.pages; track page.path) {
            <li>
              <a
                class="nav__link"
                [routerLink]="'/' + page.path"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
              >
                {{ page.title }}
              </a>
            </li>
          }
        </ul>
      } @else {
        <p class="nav__empty">Próximamente</p>
      }
    </section>
  }
</nav>

<div class="footer">
  <pg-segmented legend="Tema" [options]="themeOptions" [(value)]="theme.mode" />
</div>
