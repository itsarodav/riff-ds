<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Riff DS | A design system for music</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Playground de riff-ds: foundations y componentes del design system de Riffims."
    />

    <!-- Vista previa al compartir el enlace (Open Graph y X). Sin canonical ni og:url:
         este HTML se sirve en todas las rutas y apuntarían todas a la home. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Riff DS" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Riff DS | A design system for music" />
    <meta
      property="og:description"
      content="Playground de riff-ds: foundations y componentes del design system de Riffims."
    />
    <meta property="og:image" content="https://riff-ds.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Riff DS: Diseña una vez. Úsalo en cada producto." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Riff DS | A design system for music" />
    <meta
      name="twitter:description"
      content="Playground de riff-ds: foundations y componentes del design system de Riffims."
    />
    <meta name="twitter:image" content="https://riff-ds.netlify.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="riffims-favicon.svg" />
    <!-- Aplica el tema guardado antes de pintar, para evitar un parpadeo (ver theme/theme.ts). -->
    <script>
      try {
        var theme = localStorage.getItem('pg-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <pg-root></pg-root>
  </body>
</html>
